[project]
name = "finance-dashboard"
version = "0.1.0"
description = "Personal finance dashboard for German bank CSV exports"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.1.0",
    "dash-ag-grid>=35.2.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-bootstrap-templates>=2.1.0",
    "pandas>=3.0.2",
    "plotly>=6.6.0",
]

[project.scripts]
finance-dashboard = "finance_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_dashboard"]
